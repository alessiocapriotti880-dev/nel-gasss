name: CI

on:
  push:
  pull_request:

# Un nuovo push sullo stesso branch annulla l'esecuzione precedente ancora in corso.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    # Windows: le API usate dai provider (registro, SCM, powrprof, WMI) esistono solo lì.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults

      # Smoke test: esegue il rilevamento reale (WMI, registro, CPUID, API native) su Windows.
      # Il runner è una VM senza GPU né monitor: alcune parti risultano vuote, ma ogni errore
      # di query o di interop compare nel report come "Alcune informazioni non sono state rilevate".
      - name: Smoke test scansione hardware
        run: dotnet run --project src/PcOptimizer.Cli -c Release --no-build -- scan --json scan-report.json
      # Il runner gira come amministratore: verifica anche bcdedit, TPM e attività pianificate di sistema.
      - name: Smoke test analisi del sistema
        run: dotnet run --project src/PcOptimizer.Cli -c Release --no-build -- analyze --json analysis-report.json
      # Misure reali brevi: sessione ETW del kernel (DPC/ISR), timer, sensori, ping e confronto fra due sessioni.
      # In Azure il ping verso Internet è bloccato: deve risultare come "nessuna risposta", non come errore.
      - name: Smoke test benchmark
        run: |
          dotnet run --project src/PcOptimizer.Cli -c Release --no-build -- benchmark --duration 15 --pings 20 --label "ci prima" --json bench-before.json
          dotnet run --project src/PcOptimizer.Cli -c Release --no-build -- benchmark --duration 15 --pings 20 --label "ci dopo" --no-boot --json bench-after.json
          dotnet run --project src/PcOptimizer.Cli -c Release --no-build -- benchmark list
          dotnet run --project src/PcOptimizer.Cli -c Release --no-build -- compare --before bench-before.json --after bench-after.json
      # Catalogo degli interventi costruito dai dati reali, con lo stato di ciascuno (sola lettura).
      - name: Smoke test piano degli interventi
        run: |
          dotnet run --project src/PcOptimizer.Cli -c Release --no-build -- games add "C:\Games\Prova\prova.exe" --name Prova
          dotnet run --project src/PcOptimizer.Cli -c Release --no-build -- plan --all --json plan.json
      # Sessione reale: su Windows Server il Ripristino configurazione di sistema non esiste, quindi la sessione deve
      # fermarsi PRIMA di modificare qualcosa. Se invece il punto di ripristino c'è, l'intervento viene annullato subito.
      - name: Smoke test sessione (punto di ripristino obbligatorio)
        shell: pwsh
        run: |
          $out = dotnet run --project src/PcOptimizer.Cli -c Release --no-build -- apply --ids visual.transparency-off --duration 10 --runs 2 --yes
          $code = $LASTEXITCODE
          $out
          dotnet run --project src/PcOptimizer.Cli -c Release --no-build -- session status
          dotnet run --project src/PcOptimizer.Cli -c Release --no-build -- history
          if ($code -eq 0) {
            dotnet run --project src/PcOptimizer.Cli -c Release --no-build -- rollback --all
          } elseif (($out -join "`n") -match "punto di ripristino") {
            "Sessione interrotta senza modifiche, come previsto senza punto di ripristino."
            $global:LASTEXITCODE = 0
          } else {
            exit 1
          }
      # Overclock/undervolt guidati: checklist, procedure e test di stabilità brevi (GPU con il rasterizzatore WARP).
      - name: Smoke test tuning
        run: |
          dotnet run --project src/PcOptimizer.Cli -c Release --no-build -- tune bios
          dotnet run --project src/PcOptimizer.Cli -c Release --no-build -- tune methods
          dotnet run --project src/PcOptimizer.Cli -c Release --no-build -- tune test cpu --seconds 15
          dotnet run --project src/PcOptimizer.Cli -c Release --no-build -- tune test ram --seconds 20 --mb 512
          dotnet run --project src/PcOptimizer.Cli -c Release --no-build -- tune test gpu --seconds 10 --warp
          dotnet run --project src/PcOptimizer.Cli -c Release --no-build -- tune test vram --seconds 10 --warp
      # Interfaccia WPF: apre ogni pagina con l'analisi reale, salva un'immagine e gli errori di binding.
      # Le immagini sono stampate in base64 nel log per poterle controllare senza scaricare gli artifact.
      - name: Smoke test interfaccia
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "src/PcOptimizer.App/bin/Release/net8.0-windows/PcOptimizerPro.exe" -ArgumentList "--smoke-test", "ui-smoke" -Wait -PassThru
          Get-Content ui-smoke/bindings.txt -ErrorAction SilentlyContinue
          Get-Content ui-smoke/error.txt -ErrorAction SilentlyContinue
          foreach ($f in Get-ChildItem ui-smoke/*.jpg) {
            "=====IMG $($f.Name)====="
            [Convert]::ToBase64String([IO.File]::ReadAllBytes($f.FullName))
            "=====END====="
          }
          exit $p.ExitCode
      # Avvisi ed errori del log dell'app (con stack trace): diagnosi dei problemi visibili solo su Windows reale.
      - name: Log dell'app
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "$env:ProgramData\PcOptimizerPro\logs") {
            Get-Content "$env:ProgramData\PcOptimizerPro\logs\*.log" | Select-String -Pattern "\[WRN\]|\[ERR\]|   at |Exception" | Select-Object -First 150
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-reports
          path: |
            scan-report.json
            analysis-report.json
            bench-before.json
            bench-after.json
            plan.json
            ui-smoke
