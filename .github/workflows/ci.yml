name: CI

on:
  push:
  pull_request:

# Un nuovo push sullo stesso branch annulla l'esecuzione precedente ancora in corso.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    # Windows: le API usate dai provider (registro, SCM, powrprof, WMI) esistono solo lì.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults

      # Smoke test: esegue il rilevamento reale (WMI, registro, CPUID, API native) su Windows.
      # Il runner è una VM senza GPU né monitor: alcune parti risultano vuote, ma ogni errore
      # di query o di interop compare nel report come "Alcune informazioni non sono state rilevate".
      - name: Smoke test scansione hardware
        run: dotnet run --project src/PcOptimizer.Cli -c Release --no-build -- scan --json scan-report.json
      # Il runner gira come amministratore: verifica anche bcdedit, TPM e attività pianificate di sistema.
      - name: Smoke test analisi del sistema
        run: dotnet run --project src/PcOptimizer.Cli -c Release --no-build -- analyze --json analysis-report.json
      # Misure reali brevi: sessione ETW del kernel (DPC/ISR), timer, sensori, ping e confronto fra due sessioni.
      # In Azure il ping verso Internet è bloccato: deve risultare come "nessuna risposta", non come errore.
      - name: Smoke test benchmark
        run: |
          dotnet run --project src/PcOptimizer.Cli -c Release --no-build -- benchmark --duration 15 --pings 20 --label "ci prima" --json bench-before.json
          dotnet run --project src/PcOptimizer.Cli -c Release --no-build -- benchmark --duration 15 --pings 20 --label "ci dopo" --no-boot --json bench-after.json
          dotnet run --project src/PcOptimizer.Cli -c Release --no-build -- benchmark list
          dotnet run --project src/PcOptimizer.Cli -c Release --no-build -- compare --before bench-before.json --after bench-after.json
      # Avvisi ed errori del log dell'app (con stack trace): diagnosi dei problemi visibili solo su Windows reale.
      - name: Log dell'app
        if: always()
        shell: pwsh
        run: Get-Content "$env:ProgramData\PcOptimizerPro\logs\*.log" | Select-String -Pattern "\[WRN\]|\[ERR\]|   at |Exception" | Select-Object -First 150
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-reports
          path: |
            scan-report.json
            analysis-report.json
            bench-before.json
            bench-after.json
